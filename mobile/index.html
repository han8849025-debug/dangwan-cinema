<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>단관극장 모바일</title>
<meta name="description" content="유튜브 링크를 넣으면 폰에서 3D 극장 스크린에 걸어 주는 페이지">
<meta name="theme-color" content="#160a0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 화면 전체가 3D 극장, 아래쪽에 입장권 시트, 관람 중엔 엄지 닿는 곳에만 조작 버튼 */
:root{
  --hall:#160a0d;
  --ticket:#d5e4d0;
  --ink:#1f2c48;
  --stamp:#b3242e;
  --brass:#c9a15b;
  --hud:#ffecd6;
  --hud-bg:rgba(22,8,11,.68);
  --display:"Black Han Sans","Samsung Sans","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --body:"Gowun Dodum","Samsung Sans","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--hall);color:var(--hud);font-family:var(--body);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
[hidden]{display:none!important}
#stage{position:fixed;inset:0}
.css-layer,.gl-layer{position:absolute;inset:0}
.gl-layer{touch-action:none;outline:none}
.screen-surface{background:#0c0b0e;overflow:hidden}
.screen-surface iframe{width:100%;height:100%;border:0;display:block;pointer-events:none}
/* 스크린 조작 중: 3D 화면은 손가락을 통과시키고 유튜브 화면이 직접 눌린다 */
.screen-mode .gl-layer{pointer-events:none}
.screen-mode .screen-surface iframe{pointer-events:auto}

/* 입장권 시트 */
#overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background:linear-gradient(0deg,rgba(12,4,7,.86) 0%,rgba(12,4,7,.35) 55%,rgba(12,4,7,0) 100%);overflow-y:auto}
.ticket{width:min(560px,100%);max-height:100%;overflow-y:auto;background:var(--ticket);color:var(--ink);border-radius:8px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;
  border-top:6px dashed rgba(31,44,72,.25);-webkit-user-select:text;user-select:text}
.ticket header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:44px;line-height:.95;color:var(--stamp);letter-spacing:-.01em}
.stub{font-size:13px;opacity:.7;text-align:right;line-height:1.4;font-variant-numeric:tabular-nums}
.lede{margin:0;font-size:16px;line-height:1.6}
#now{margin:0;font-size:15px;line-height:1.5;padding:8px 12px;background:rgba(31,44,72,.08);border-radius:4px}
#now strong{font-weight:400;color:var(--stamp)}
form{display:flex;flex-direction:column;gap:8px}
label{font-size:14px}
input[type=url]{width:100%;font:16px/1.2 var(--body);color:var(--ink);background:rgba(255,255,255,.65);border:1.5px solid var(--ink);border-radius:4px;padding:13px 12px}
input[type=url]::placeholder{color:rgba(31,44,72,.45)}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.go{font-family:var(--display);font-size:21px;color:var(--ticket);background:var(--ink);border:0;border-radius:4px;padding:14px 20px}
.go:active{background:var(--stamp)}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.links{display:flex;flex-wrap:wrap;gap:6px 20px}
.textlink{background:none;border:0;padding:6px 0;color:var(--ink);font-size:15px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(31,44,72,.4)}
#err{margin:0;color:var(--stamp);font-size:15px;line-height:1.5}
.guide{margin:0;padding:12px 0 0;border-top:1px solid rgba(31,44,72,.18);list-style:none;display:grid;gap:7px;font-size:14px;line-height:1.45}
.guide li{display:flex;gap:10px;align-items:baseline}
.guide b{flex:none;min-width:4.6em;font-weight:400;color:var(--stamp)}

/* 관람 중 화면 표시 */
#hud{position:fixed;inset:0;z-index:3;pointer-events:none}
#prompt{position:absolute;left:50%;top:calc(50% + 24px);transform:translateX(-50%);font-size:15px;background:var(--hud-bg);padding:7px 13px;border-radius:5px;white-space:nowrap}
#toast{position:absolute;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);font-size:15px;background:var(--hud-bg);padding:9px 16px;border-radius:5px;max-width:calc(100% - 32px);text-align:center;transition:opacity .25s}
#toast.off{opacity:0}
#stick{position:absolute;left:max(20px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;
  border:2px solid rgba(255,236,214,.4);background:rgba(22,8,11,.38);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,236,214,.6)}
#tbtns{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,auto);gap:10px;pointer-events:auto}
.hb{min-width:84px;height:52px;padding:0 14px;border-radius:26px;border:1.5px solid rgba(255,236,214,.42);background:var(--hud-bg);color:var(--hud);font-size:16px}
.hb:active{background:rgba(179,36,46,.8)}
#back{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));pointer-events:auto}
@media (orientation:portrait){
  #tbtns{grid-template-columns:auto}
}
@media (max-height:480px){
  .lede,.guide{display:none}
  h1{font-size:34px}
  .ticket{padding-block:14px;gap:10px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="stage"></div>

<div id="hud" hidden>
  <div id="prompt" hidden></div>
  <div id="toast" class="off"></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="tbtns">
    <button class="hb" id="tSit" type="button">앉기</button>
    <button class="hb" id="tPlay" type="button">재생</button>
    <button class="hb" id="tScreen" type="button">스크린 조작</button>
    <button class="hb" id="tMenu" type="button">메뉴</button>
  </div>
  <button class="hb" id="back" type="button" hidden>돌아가기</button>
</div>

<div id="overlay">
  <section class="ticket" aria-labelledby="title">
    <header>
      <h1 id="title">단관극장</h1>
      <div class="stub">입장권 · 제1관<br><span id="serial">No. 000000</span></div>
    </header>
    <p class="lede" id="lede">유튜브 링크를 넣으면 이 극장 스크린에 걸려요. 가로로 돌려서 보면 더 커요.</p>
    <p id="now" hidden></p>
    <form id="form" novalidate>
      <label for="link">유튜브 링크</label>
      <input id="link" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="여기에 링크를 붙여 넣으세요">
      <p id="err" role="alert" hidden></p>
      <button class="go" id="go" type="submit">상영 시작</button>
      <div class="links">
        <button class="textlink" id="sample" type="button">예시 영상 넣기</button>
        <button class="textlink" id="cc" type="button">자막 켜기</button>
        <button class="textlink" id="fs" type="button">전체 화면으로 보기</button>
      </div>
    </form>
    <ul class="guide">
      <li><b>걷기</b><span>왼쪽 아래 동그라미를 끌어요</span></li>
      <li><b>둘러보기</b><span>빈 화면을 손가락으로 끌어요</span></li>
      <li><b>앉기</b><span>의자를 톡 누르면 그 자리로 가서 앉아요</span></li>
      <li><b>광고·자막</b><span>스크린을 누르면 화면이 커지고, 유튜브 버튼(건너뛰기, 자막)을 직접 누를 수 있어요</span></li>
    </ul>
  </section>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

const $ = (id) => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- 극장 치수 (단위: 미터) ----------
const HALL = { w: 16, d: 21, h: 8.6 };
const SCREEN = { w: 11.2, h: 6.3, y: 4.4, z: 0.06 };
const STAGE = { d: 2.2, h: 0.8 };
const ROWS = 10, SEATS = 14, ROW0 = 5.4, ROW_D = 1.25, STEP = 0.3, PITCH = 0.62;
const ROW_NAMES = '가나다라마바사아자차';
const SAMPLE = 'https://www.youtube.com/watch?v=aqz-KE-bpKQ';
const EYE_STAND = 1.62, EYE_SIT = 1.12, RADIUS = 0.2;
const YT_HOST = 'https://www.youtube-nocookie.com';

$('serial').textContent = 'No. ' + String(Math.floor(Math.random() * 900000) + 100000);

await Promise.race([
  document.fonts.load('64px "Black Han Sans"').catch(() => {}),
  new Promise((r) => setTimeout(r, 1500)),
]);

// ---------- 렌더러 ----------
const stageEl = $('stage');
const cssRenderer = new CSS3DRenderer();
cssRenderer.domElement.className = 'css-layer';
stageEl.appendChild(cssRenderer.domElement);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.domElement.className = 'gl-layer';
stageEl.appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0507, 0.011);
const cssScene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 80);
camera.rotation.order = 'YXZ';

// 세로·가로 어느 쪽이든 좌우 시야가 비슷하게 나오도록 화각을 맞춘다
function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  const hfov = THREE.MathUtils.degToRad(88);
  const vfov = 2 * Math.atan(Math.tan(hfov / 2) / camera.aspect);
  camera.fov = THREE.MathUtils.clamp(THREE.MathUtils.radToDeg(vfov), 50, 100);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  cssRenderer.setSize(w, h);
  if (screenMode && !player.tween) player.z = SCREEN.z + fitDistance();
}
addEventListener('resize', resize);

// ---------- 캔버스로 그리는 텍스처 ----------
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}
const carpetTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#3b131a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 5000; i++) {
    g.fillStyle = `rgba(${Math.random() < 0.5 ? 0 : 110},0,10,${Math.random() * 0.2})`;
    g.fillRect(Math.random() * w, Math.random() * h, 1.6, 1.6);
  }
  g.strokeStyle = 'rgba(190,145,70,.5)'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(w / 2, 16); g.lineTo(w - 16, h / 2); g.lineTo(w / 2, h - 16); g.lineTo(16, h / 2); g.closePath(); g.stroke();
  g.fillStyle = 'rgba(190,145,70,.6)';
  for (const [x, y] of [[w / 2, h / 2], [0, 0], [w, 0], [0, h], [w, h]]) { g.beginPath(); g.arc(x, y, 9, 0, 7); g.fill(); }
});
const fabricTex = canvasTex(128, 8, (g, w, h) => {
  for (let x = 0; x < w; x++) {
    const s = 0.62 + 0.38 * Math.pow(0.5 + 0.5 * Math.sin((x / w) * Math.PI * 4), 0.7);
    g.fillStyle = `rgb(${82 * s | 0},${26 * s | 0},${34 * s | 0})`;
    g.fillRect(x, 0, 1, h);
  }
});
const woodTex = canvasTex(256, 64, (g, w, h) => {
  g.fillStyle = '#3e2417'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 70; i++) {
    g.strokeStyle = `rgba(${Math.random() < 0.5 ? 20 : 90},${Math.random() < 0.5 ? 10 : 50},0,${0.15 + Math.random() * 0.2})`;
    g.lineWidth = 0.6 + Math.random() * 1.6;
    const y = Math.random() * h;
    g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(w * 0.3, y + 3, w * 0.6, y - 3, w, y); g.stroke();
  }
  g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(0, h - 2, w, 2);
});
function signTex(text, bg, fg, w = 512, h = 180, size = 110) {
  return canvasTex(w, h, (g) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.fillStyle = fg; g.font = `${size}px "Black Han Sans", sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(text, w / 2, h / 2 + size * 0.05);
  });
}

function worldUV(geo, tile) {
  const p = geo.attributes.position, n = geo.attributes.normal, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
    let u, v;
    if (ay >= ax && ay >= az) { u = p.getX(i); v = p.getZ(i); }
    else if (ax >= az) { u = p.getZ(i); v = p.getY(i); }
    else { u = p.getX(i); v = p.getY(i); }
    uv.setXY(i, u / tile, v / tile);
  }
  uv.needsUpdate = true;
  return geo;
}
function box(w, h, d, x, y, z, mat, tile) {
  const g = new THREE.BoxGeometry(w, h, d);
  g.translate(x, y, z);
  if (tile) worldUV(g, tile);
  const m = new THREE.Mesh(g, mat);
  scene.add(m);
  return m;
}

// ---------- 재질 ----------
const carpetMat = new THREE.MeshStandardMaterial({ map: carpetTex, roughness: 1 });
const wallMat = new THREE.MeshStandardMaterial({ map: fabricTex, roughness: 0.95 });
const woodMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.65 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x1c0c10, roughness: 0.9 });
const brassMat = new THREE.MeshStandardMaterial({ color: 0xc9a15b, metalness: 0.35, roughness: 0.35 });
const ironMat = new THREE.MeshStandardMaterial({ color: 0x1d1517, metalness: 0.3, roughness: 0.6 });
const maskMat = new THREE.MeshStandardMaterial({ color: 0x050304, roughness: 1 });
const ceilMat = new THREE.MeshStandardMaterial({ color: 0x140a0d, roughness: 1 });
const velvetMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.85 });
const curtainMat = new THREE.MeshStandardMaterial({ color: 0x8c1521, roughness: 0.8, side: THREE.DoubleSide });

// ---------- 바닥 ----------
function floorY(x, z) {
  if (z < STAGE.d) return STAGE.h;
  if (z < STAGE.d + 0.5 && Math.abs(x) > 5.8) return 0.4;
  if (z < ROW0) return 0;
  return Math.min(ROWS, Math.floor((z - ROW0) / ROW_D)) * STEP;
}
box(HALL.w, 0.2, ROW0 - STAGE.d, 0, -0.1, (ROW0 + STAGE.d) / 2, carpetMat, 1.4);
for (let r = 0; r <= ROWS; r++) {
  const top = r * STEP, h = top + 0.2;
  const z0 = ROW0 + r * ROW_D, z1 = r === ROWS ? HALL.d : z0 + ROW_D;
  box(HALL.w, h, z1 - z0, 0, top - h / 2, (z0 + z1) / 2, carpetMat, 1.4);
}
box(HALL.w, STAGE.h, STAGE.d, 0, STAGE.h / 2, STAGE.d / 2, woodMat, 1.6);
box(HALL.w, 0.05, 0.06, 0, STAGE.h - 0.02, STAGE.d + 0.01, brassMat);
for (const sx of [-1, 1]) box(2.2, 0.4, 0.5, sx * 6.9, 0.2, STAGE.d + 0.25, woodMat, 1.6);

// ---------- 벽·천장 ----------
for (const sx of [-1, 1]) {
  box(0.2, HALL.h, HALL.d, sx * (HALL.w / 2 + 0.1), HALL.h / 2, HALL.d / 2, wallMat, 1.8);
  const segs = [[STAGE.d, ROW0, 0]];
  for (let r = 0; r <= ROWS; r++) segs.push([ROW0 + r * ROW_D, r === ROWS ? HALL.d : ROW0 + (r + 1) * ROW_D, r * STEP]);
  for (const [z0, z1, y0] of segs) {
    box(0.06, 1.1, z1 - z0, sx * (HALL.w / 2 - 0.03), y0 + 0.55, (z0 + z1) / 2, woodMat, 1.6);
    box(0.08, 0.04, z1 - z0, sx * (HALL.w / 2 - 0.04), y0 + 1.12, (z0 + z1) / 2, brassMat);
  }
}
box(HALL.w, HALL.h, 0.2, 0, HALL.h / 2, -0.1, darkMat);
box(HALL.w, HALL.h, 0.2, 0, HALL.h / 2, HALL.d + 0.1, wallMat, 1.8);
box(HALL.w + 0.4, 0.2, HALL.d, 0, HALL.h + 0.1, HALL.d / 2, ceilMat);
for (const sx of [-1, 1]) {
  box(0.7, HALL.h, 0.7, sx * 7.65, HALL.h / 2, 0.55, darkMat);
  box(0.06, HALL.h, 0.72, sx * 7.28, HALL.h / 2, 0.55, brassMat);
}
box(HALL.w, 0.5, 0.7, 0, HALL.h - 0.25, 0.55, darkMat);

const sconceMat = new THREE.MeshStandardMaterial({ color: 0x2a1a10, emissive: 0xffc27a, emissiveIntensity: 2 });
const sconceGeo = new THREE.CylinderGeometry(0.14, 0.1, 0.38, 16, 1, false, 0, Math.PI);
for (const z of [4.6, 8.4, 12.2, 16, 19.6]) {
  for (const sx of [-1, 1]) {
    box(0.3, HALL.h, 0.5, sx * 7.86, HALL.h / 2, z, darkMat);
    const m = new THREE.Mesh(sconceGeo, sconceMat);
    m.position.set(sx * 7.7, floorY(sx * 7, z) + 2.7, z);
    m.rotation.y = sx > 0 ? Math.PI / 2 : -Math.PI / 2;
    scene.add(m);
  }
}
box(SCREEN.w + 0.6, SCREEN.h + 0.6, 0.04, 0, SCREEN.y, 0.02, maskMat);

const exitMat = new THREE.MeshBasicMaterial({ map: signTex('비상구', '#14a54c', '#f4fff6'), toneMapped: false, fog: false });
const exitGeo = new THREE.PlaneGeometry(0.9, 0.32);
function exitSign(x, y, z, ry) {
  const m = new THREE.Mesh(exitGeo, exitMat);
  m.position.set(x, y, z); m.rotation.y = ry; scene.add(m);
}
for (const sx of [-1, 1]) {
  box(0.06, 2.2, 1.3, sx * (HALL.w / 2 - 0.04), 1.1, 3.8, woodMat, 1);
  box(0.06, 0.05, 0.8, sx * (HALL.w / 2 - 0.09), 1.05, 3.8, brassMat);
  exitSign(sx * (HALL.w / 2 - 0.06), 2.75, 3.8, -sx * Math.PI / 2);
  box(1.3, 2.2, 0.06, sx * 6, ROWS * STEP + 1.1, HALL.d - 0.04, woodMat, 1);
  box(0.8, 0.05, 0.06, sx * 6, ROWS * STEP + 1.05, HALL.d - 0.09, brassMat);
  exitSign(sx * 6, ROWS * STEP + 2.6, HALL.d - 0.06, Math.PI);
}

const boothMat = new THREE.MeshBasicMaterial({ color: 0xffb070, toneMapped: false, fog: false });
const booth = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.6), boothMat);
booth.position.set(0, 6.9, HALL.d - 0.04); booth.rotation.y = Math.PI; scene.add(booth);
box(1.4, 0.8, 0.05, 0, 6.9, HALL.d - 0.005, ironMat);

const ceilLampMat = new THREE.MeshBasicMaterial({ color: 0xffd9a8, toneMapped: false });
const lampGeo = new THREE.CircleGeometry(0.16, 20);
for (let i = 0; i < 4; i++) for (let j = 0; j < 6; j++) {

function pleatGeo(w, h, folds, depth) {
  const g = new THREE.PlaneGeometry(w, h, folds * 10, 4);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i) + w / 2, u = x / w;
    p.setX(i, x);
    p.setZ(i, Math.sin(u * folds * Math.PI * 2) * depth + Math.sin(u * folds * Math.PI * 0.9 + 1.3) * depth * 0.35);
  }
  g.computeVertexNormals();
  return g;
}

const ADD_BLEND = { blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor, blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor };
const apex = new THREE.Vector3(0, 6.9, HALL.d - 0.1);
const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => new THREE.Vector3(a * (SCREEN.w / 2 - 0.2), SCREEN.y + b * (SCREEN.h / 2 - 0.2), 0.2));
const beamUniforms = { uI: { value: 0 }, uTime: { value: 0 }, uColor: { value: new THREE.Color(0.75, 0.82, 1.0) } };
let beam, dust;
{
  const pos = [], tt = [], ee = [];
  for (let i = 0; i < 4; i++) {
    const c1 = corners[i], c2 = corners[(i + 1) % 4];
    pos.push(apex.x, apex.y, apex.z, c1.x, c1.y, c1.z, c2.x, c2.y, c2.z);
    tt.push(0, 1, 1);
    ee.push(0.5, 0, 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('t', new THREE.Float32BufferAttribute(tt, 1));
  g.setAttribute('e', new THREE.Float32BufferAttribute(ee, 1));
  beam = new THREE.Mesh(g, new THREE.ShaderMaterial({
    uniforms: beamUniforms, transparent: true, depthWrite: false, side: THREE.DoubleSide, ...ADD_BLEND,
    vertexShader: `attribute float t; attribute float e; varying float vT; varying float vE; varying vec3 vP;
      void main(){ vT=t; vE=e; vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `uniform float uI; uniform float uTime; uniform vec3 uColor; varying float vT; varying float vE; varying vec3 vP;
      void main(){
        float fade = smoothstep(0.0,0.1,vT)*(1.0-smoothstep(0.4,0.95,vT));
        fade *= pow(sin(3.14159*clamp(vE,0.0,1.0)),0.8);
        fade *= smoothstep(1.5,7.0,length(vP-cameraPosition));
        float n = 0.75+0.25*sin(vP.x*3.1+uTime*0.7)*sin(vP.y*2.3-uTime*0.5);
        float a = uI*fade*n; gl_FragColor = vec4(uColor*a, a); }`,
  }));
  beam.renderOrder = 2;

  const COUNT = 300, dp = [], seed = [];

  const dg = new THREE.BufferGeometry();
  dg.setAttribute('position', new THREE.Float32BufferAttribute(dp, 3));
  dg.setAttribute('seed', new THREE.Float32BufferAttribute(seed, 1));
  dust = new THREE.Points(dg, new THREE.ShaderMaterial({
    uniforms: beamUniforms, transparent: true, depthWrite: false, ...ADD_BLEND,
    vertexShader: `attribute float seed; uniform float uTime; varying float vA;
      void main(){
        vec3 p = position + vec3(sin(uTime*0.13+seed)*0.35, sin(uTime*0.09+seed*1.7)*0.25, cos(uTime*0.11+seed*0.6)*0.35);
        vec4 mv = modelViewMatrix*vec4(p,1.0);
        gl_PointSize = 16.0/(-mv.z);
        vA = (0.5+0.5*sin(uTime*0.8+seed*3.0))*smoothstep(2.0,6.0,-mv.z);
        gl_Position = projectionMatrix*mv; }`,
    fragmentShader: `uniform float uI; uniform vec3 uColor; varying float vA;
      void main(){ float d = length(gl_PointCoord-0.5); float a = smoothstep(0.5,0.0,d)*uI*3.5*vA; gl_FragColor = vec4(uColor*a, a); }`,
  }));

  scene.add(dust);

const yt = { iframe: null, id: null, raw: '', ready: false, state: -1, time: 0, title: '', timer: 0, ccOn: false };
function ytPost(msg) {

function ytListen() {

// 자동 생성 자막: 재생이 시작될 때마다(광고가 끝나고 본편이 시작될 때 포함) 자막 모듈을 내린다
let ccTimers = [];
function captionsOff() {
  ytCmd('setOption', ['captions', 'track', {}]);
  ytCmd('unloadModule', ['captions']);
  ytCmd('unloadModule', ['cc']);
}
function scheduleCaptionsOff() {
  if (yt.ccOn) return;
  ccTimers.forEach(clearTimeout);
  ccTimers = [0, 700, 2000, 5000].map((ms) => setTimeout(() => { if (!yt.ccOn) captionsOff(); }, ms));

function setCaptions(on) {
  yt.ccOn = on;
  $('cc').textContent = on ? '자막 끄기' : '자막 켜기';
  if (on) { ccTimers.forEach(clearTimeout); ytCmd('loadModule', ['captions']); ytCmd('loadModule', ['cc']); }
  else captionsOff();
}
function parseTime(t) {
  if (!t) return 0;
  if (/^\d+$/.test(t)) return +t;
  const m = t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
  return m ? (+(m[1] || 0)) * 3600 + (+(m[2] || 0)) * 60 + (+(m[3] || 0)) : 0;
}
function parseYouTube(text) {
  text = text.trim();
  if (!text) return null;
  const found = text.match(/https?:\/\/\S+/);
  if (found) text = found[0];
  if (/^[\w-]{11}$/.test(text)) return { id: text, start: 0 };
  let u;
  try { u = new URL(/^https?:\/\//i.test(text) ? text : 'https://' + text); } catch { return null; }
  const host = u.hostname.replace(/^(www|m|music)\./, '');
  let id = null;
  if (host === 'youtu.be') id = u.pathname.split('/')[1];
  else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
    if (u.pathname === '/watch') id = u.searchParams.get('v');
    else id = (u.pathname.match(/^\/(?:embed|shorts|live|v)\/([\w-]{11})/) || [])[1];
  }
  if (!id || !/^[\w-]{11}$/.test(id)) return null;
  return { id, start: parseTime(u.searchParams.get('t') || u.searchParams.get('start')), list: u.searchParams.get('list') };
}
function loadVideo(p, raw) {
  if (!yt.iframe) {
    yt.iframe = document.createElement('iframe');
    yt.iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
    yt.iframe.referrerPolicy = 'strict-origin-when-cross-origin';
    yt.iframe.title = '스크린에 상영 중인 유튜브 영상';
    yt.iframe.addEventListener('load', () => ytPost({ event: 'listening' }));
    screenEl.appendChild(yt.iframe);
  }
  Object.assign(yt, { id: p.id, raw, ready: false, state: -1, time: p.start || 0, title: '' });
  const q = new URLSearchParams({ enablejsapi: 1, autoplay: 1, controls: 1, rel: 0, playsinline: 1, iv_load_policy: 3, cc_load_policy: 0, fs: 0, origin: location.origin });
  if (p.start) q.set('start', p.start);
  if (p.list) q.set('list', p.list);
  yt.iframe.src = `${YT_HOST}/embed/${p.id}?${q}`;
  ytListen();
  show.loaded = true;
  clearTimeout(show.autoplayCheck);
  show.autoplayCheck = setTimeout(() => {
    if (yt.state !== 1 && show.loaded && !screenMode) toast('재생 버튼을 누르면 시작돼요. 안 되면 스크린을 눌러 유튜브 재생 버튼을 직접 눌러 주세요', 4500);
  }, 4500);
}
const YT_ERRORS = {

  5: '이 브라우저에서는 재생할 수 없는 영상이에요. 다른 링크를 넣어 주세요.',

  153: '유튜브가 재생을 거부했어요. 페이지를 새로고침한 뒤 다시 넣어 주세요.',
};
function setState(s) {
  if (s === 1 && yt.state !== 1) scheduleCaptionsOff();
  yt.state = s;
}
addEventListener('message', (e) => {
  if (!/^https:\/\/www\.youtube(-nocookie)?\.com$/.test(e.origin) || e.source !== yt.iframe?.contentWindow) return;
  let d;
  try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch { return; }
  if (!d || !d.event) return;
  if (d.event === 'onReady' || d.event === 'initialDelivery') {
    if (!yt.ready) {
      yt.ready = true;
      ytCmd('addEventListener', ['onStateChange']);
      ytCmd('addEventListener', ['onError']);
      if (!yt.ccOn) captionsOff();
    }
  }
  if (d.event === 'initialDelivery' || d.event === 'infoDelivery') {
    const i = d.info || {};
    if (typeof i.playerState === 'number') setState(i.playerState);
    if (typeof i.currentTime === 'number') yt.time = i.currentTime;
    if (i.videoData?.title) yt.title = i.videoData.title;
  }
  if (d.event === 'onStateChange' && typeof d.info === 'number') setState(d.info);
  if (d.event === 'onError') {
    show.loaded = false;
    clearTimeout(show.autoplayCheck);
    if (screenMode) exitScreenMode();
    openMenu(YT_ERRORS[d.info] || `영상을 불러오지 못했어요 (오류 ${d.info}). 다른 링크를 넣어 주세요.`);
  }
});

function seatLabel(s) { return `${ROW_NAMES[s.row]}열 ${s.n}번`; }
function nearestSeat() {
  let best = null, bd = 1.3;
  for (const s of seats) {
    const d = Math.hypot(s.x - player.x, s.z - player.z);
    if (d < bd && Math.abs(floorY(player.x, player.z) - s.y) < 0.65) { bd = d; best = s; }
  }
  return best;
}
function highlight(s) {
  if (s === hiSeat) return;
  if (hiSeat) { cushion.setColorAt(hiSeat.k, SEAT_COL); backrest.setColorAt(hiSeat.k, BACK_COL); }
  if (s) { cushion.setColorAt(s.k, HI_COL); backrest.setColorAt(s.k, HI_COL); }
  cushion.instanceColor.needsUpdate = backrest.instanceColor.needsUpdate = true;
  hiSeat = s;
}
function wrapAngle(a) { return Math.atan2(Math.sin(a), Math.cos(a)); }
function startTween(to, dur = 0.7) {
  player.tween = { from: { x: player.x, z: player.z, eye: player.eye, yaw: player.yaw, pitch: player.pitch }, to, t: 0, dur: reduceMotion ? 0.01 : dur };
}
function sitAt(s) {
  if (player.tween || !s) return;
  highlight(null);
  const dist = Math.hypot(s.x - player.x, s.z - player.z);
  player.seated = s;
  const eye = s.y + EYE_SIT;
  const pitch = Math.atan2(SCREEN.y - eye, s.z - SCREEN.z) * 0.85;
  startTween({ x: s.x, z: s.z + 0.04, eye, yaw: 0, pitch }, Math.min(1.8, 0.7 + dist * 0.07));
  toast(`${seatLabel(s)}에 앉았어요`);
}
function standUp() {
  if (player.tween || !player.seated) return;
  const s = player.seated;
  player.seated = null;
  startTween({ x: s.x, z: s.rowStart + 0.07, eye: s.y + EYE_STAND, yaw: player.yaw, pitch: player.pitch * 0.5 }, 0.55);
  toast('자리에서 일어났어요');
}
function sitButton() {
  if (player.seated) return standUp();
  const s = hiSeat || nearestSeat();
  if (s) sitAt(s);
  else toast('의자를 톡 누르면 그 자리로 가서 앉아요');
}

// ---------- 스크린 조작 (화면을 정면으로 크게 띄우고 유튜브 버튼을 직접 누른다) ----------
function fitDistance() {
  const vt = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return Math.max((SCREEN.h / 2) / vt, (SCREEN.w / 2) / (vt * camera.aspect)) * 1.1;
}
function enterScreenMode() {
  if (!show.loaded) { openMenu('먼저 유튜브 링크를 넣어 주세요.'); return; }
  if (player.tween || screenMode) return;
  screenMode = { x: player.x, z: player.z, eye: player.eye, yaw: player.yaw, pitch: player.pitch };
  highlight(null);
  resetStick();
  startTween({ x: 0, z: SCREEN.z + fitDistance(), eye: SCREEN.y, yaw: 0, pitch: 0 }, 0.8);
  document.body.classList.add('screen-mode');
  $('stick').hidden = $('tbtns').hidden = true;
  $('back').hidden = false;
  toast('광고 건너뛰기나 자막 버튼을 화면에서 직접 누르세요', 3000);
}
function exitScreenMode() {
  if (!screenMode) return;
  const s = screenMode;
  screenMode = null;
  player.tween = null;
  startTween({ x: s.x, z: s.z, eye: s.eye, yaw: s.yaw, pitch: s.pitch }, 0.7);
  document.body.classList.remove('screen-mode');
  $('stick').hidden = $('tbtns').hidden = false;
  $('back').hidden = true;
}
$('tScreen').addEventListener('click', enterScreenMode);
$('back').addEventListener('click', exitScreenMode);

// ---------- 터치 입력 ----------
function look(dx, dy, sens) {
  player.yaw -= dx * sens;
  player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch - dy * sens));
}
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function tapAt(cx, cy) {
  ndc.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects([cushion, backrest, hole, curtL, curtR], false)[0];
  if (!hit) return;
  if (hit.object === hole) { enterScreenMode(); return; }
  if (hit.object === cushion || hit.object === backrest) {
    const s = seats[hit.instanceId];
    if (s && s !== player.seated) sitAt(s);
  }
}
let drag = null;
canvas.addEventListener('pointerdown', (e) => {
  if (overlayOpen || mode !== 'inside' || screenMode || drag) return;
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: 0, t: performance.now() };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
  if (!player.tween) look(dx, dy, 0.005);
});
function dragEnd(e) {
  if (!drag || e.pointerId !== drag.id) return;
  if (e.type === 'pointerup' && drag.moved < 12 && performance.now() - drag.t < 400) tapAt(drag.sx, drag.sy);
  drag = null;
}
canvas.addEventListener('pointerup', dragEnd);
canvas.addEventListener('pointercancel', dragEnd);

const stick = { x: 0, y: 0, id: null };
const stickEl = $('stick'), knob = $('knob');
function stickMove(e) {
  const r = stickEl.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const len = Math.hypot(dx, dy), max = r.width / 2 - 8;
  if (len > max) { dx *= max / len; dy *= max / len; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  stick.x = dx / max; stick.y = -dy / max;
}
function resetStick() { stick.id = null; stick.x = stick.y = 0; knob.style.transform = ''; }
stickEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  stick.id = e.pointerId;
  stickEl.setPointerCapture(e.pointerId);
  if (player.seated) standUp();
  stickMove(e);
});
stickEl.addEventListener('pointermove', (e) => { if (e.pointerId === stick.id) stickMove(e); });
const stickEnd = (e) => { if (e.pointerId === stick.id) resetStick(); };
stickEl.addEventListener('pointerup', stickEnd);
stickEl.addEventListener('pointercancel', stickEnd);
stickEl.addEventListener('lostpointercapture', stickEnd);
$('tSit').addEventListener('click', sitButton);
$('tPlay').addEventListener('click', togglePlay);
$('tMenu').addEventListener('click', () => openMenu());
addEventListener('contextmenu', (e) => e.preventDefault());

// ---------- 이동과 충돌 ----------
function blocked(x, z) {
  if (x < -HALL.w / 2 + 0.4 || x > HALL.w / 2 - 0.4 || z < 0.8 || z > HALL.d - 0.4) return true;
  for (const b of blockers) if (x > b.x0 - RADIUS && x < b.x1 + RADIUS && z > b.z0 - RADIUS && z < b.z1 + RADIUS) return true;
  return false;
}
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const ease = (t) => t * t * (3 - 2 * t);

function updatePlayer(dt) {
  const tw = player.tween;
  if (tw) {
    tw.t = Math.min(1, tw.t + dt / tw.dur);
    const k = ease(tw.t), f = tw.from, to = tw.to;
    player.x = f.x + (to.x - f.x) * k;
    player.z = f.z + (to.z - f.z) * k;
    player.eye = f.eye + (to.eye - f.eye) * k;
    player.yaw = f.yaw + wrapAngle(to.yaw - f.yaw) * k;
    player.pitch = f.pitch + (to.pitch - f.pitch) * k;
    if (tw.t >= 1) player.tween = null;
    return;
  }
  if (screenMode) return;
  let moving = false;
  if (!player.seated && !overlayOpen) {
    const fw = stick.y, st = stick.x;
    const len = Math.hypot(fw, st);
    if (len > 0.08) {
      const speed = 1.2 + 2.6 * Math.min(1, len);
      const nf = fw / Math.max(1, len), ns = st / Math.max(1, len);
      const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
      const dx = (-sy * nf + cy * ns) * speed * dt, dz = (-cy * nf - sy * ns) * speed * dt;
      if (!blocked(player.x + dx, player.z)) player.x += dx;
      if (!blocked(player.x, player.z + dz)) player.z += dz;
      player.bob += dt * speed * 2.2;
      moving = true;
    }
  }
  const target = player.seated ? player.seated.y + EYE_SIT : floorY(player.x, player.z) + EYE_STAND;
  player.eye = damp(player.eye, target, 9, dt);
  if (!moving) player.bob = damp(player.bob, Math.round(player.bob / Math.PI) * Math.PI, 6, dt);
}

let sitLabel = '';
function updateSeatUI() {
  const prompt = $('prompt');
  const label = player.seated ? '일어나기' : '앉기';
  if (label !== sitLabel) { sitLabel = label; $('tSit').textContent = label; }
  if (mode !== 'inside' || overlayOpen || player.tween || screenMode || player.seated) {
    if (player.seated || screenMode) highlight(null);
    prompt.hidden = true;
    return;
  }
  const s = nearestSeat();
  highlight(s);
  prompt.hidden = !s;
  if (s) prompt.textContent = `앉기 버튼으로 ${seatLabel(s)}에 앉기`;
}

// ---------- 매 프레임 ----------
const clock = new THREE.Clock();
let time = 0;
const boothIdle = new THREE.Color(1, 0.69, 0.44), boothOn = new THREE.Color(1.3, 1.35, 1.5);
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;

  if (mode === 'lobby') {
    const a = reduceMotion ? 0.4 : time * 0.06;
    camera.position.set(Math.sin(a) * 3.2, 4.9 + Math.sin(a * 1.7) * 0.25, 18.8);
    camera.lookAt(0, 4.1, 0);
  } else {
    updatePlayer(dt);
    const bobY = player.seated || player.tween || screenMode ? 0 : Math.sin(player.bob) * 0.03;
    camera.position.set(player.x, player.eye + bobY, player.z);
    camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
  }
  updateSeatUI();

  const playing = yt.state === 1 || yt.state === 3;
  const curtainTarget = show.loaded && yt.state !== 0 ? 1 : 0;
  const cs = reduceMotion ? 2 : 1 / 4.5;
  show.curtain += Math.sign(curtainTarget - show.curtain) * Math.min(Math.abs(curtainTarget - show.curtain), dt * cs);
  const o = ease(show.curtain);
  const sx = 1 - 0.72 * o;
  curtL.scale.set(sx, 1, 1 + 1.4 * o);
  curtR.scale.set(sx, 1, 1 + 1.4 * o);

  const houseTarget = mode === 'inside' && show.loaded ? (playing ? 0.1 : 0.5) : 1;
  show.house = damp(show.house, houseTarget, 1.4, dt);
  const h = show.house;
  ambient.intensity = 0.06 + 0.32 * h;
  hemi.intensity = 0.05 + 0.45 * h;
  sconceLights.forEach((l) => (l.intensity = 1 + 11 * h));
  sconceMat.emissiveIntensity = 0.4 + 2 * h;
  ceilLampMat.color.setRGB(1, 0.85, 0.66).multiplyScalar(0.12 + 0.88 * h);
  wash.intensity = 260 * (1 - o * 0.85) * (0.3 + 0.7 * h);

  const flick = 0.82 + 0.1 * Math.sin(time * 2.3) * Math.sin(time * 0.71) + 0.08 * Math.sin(time * 5.7 + Math.sin(time));
  screenLight.intensity = o * (playing ? 4.2 : 1.8) * flick;
  screenLight.color.setHSL(0.6 + 0.05 * Math.sin(time * 0.23), 0.3, 0.78);
  // 스크린 조작 중엔 빛줄기·먼지가 화면 위에 겹치지 않게 끈다
  beamUniforms.uI.value = damp(beamUniforms.uI.value, playing && !screenMode ? 0.05 * o : 0, 2, dt);
  beamUniforms.uTime.value = time;
  boothMat.color.copy(playing ? boothOn : boothIdle);
  const tp = playing ? '일시정지' : '재생';
  if ($('tPlay').textContent !== tp) $('tPlay').textContent = tp;

  renderer.render(scene, camera);
  cssRenderer.render(cssScene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
